<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submitted</title>
<style>
  * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
  }

  body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0b1329; /* Deep dark slate background matching the theme */
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
  }

  /* Success/Confirmation Card */
  .box {
      width: 100%;
      max-width: 460px;
      padding: 40px 30px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      animation: fadeIn 0.6s ease;
      position: relative;
  }

  @keyframes fadeIn {
      from {
          opacity: 0;
          transform: translateY(20px);
      }
      to {
          opacity: 1;
          transform: translateY(0);
      }
  }

  /* Decorative Success Icon / Checkmark Element */
  .box::before {
      content: "✓";
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 60px;
      height: 60px;
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      font-size: 28px;
      font-weight: bold;
      border-radius: 50%;
      border: 1px solid rgba(34, 197, 94, 0.3);
      margin-bottom: 20px;
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.2);
  }

  .box h2 {
      color: #f8fafc;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: 0.3px;
  }

  .box p {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
      margin: 0;
  }

  /* Responsive adjustment */
  @media (max-width: 480px) {
      .box {
          padding: 30px 20px;
          border-radius: 18px;
      }

      .box h2 {
          font-size: 21px;
      }

      .box p {
          font-size: 14px;
      }
  }
</style>
</head>
<body>
  <div class="box">
    <h2>Exam Submitted</h2>
    <p>Your answers have been saved. Results will be shown after evaluation.</p>
  </div>
</body>
</html>
