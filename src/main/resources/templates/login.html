
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        font-family: 'Segoe UI', Arial, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e3a8a, #6366f1);
        overflow-x: hidden;
        position: relative;
    }

    /* Background decorative circles */
    body::before,
    body::after {
        content: "";
        position: fixed;
        border-radius: 50%;
        filter: blur(2px);
        z-index: 0;
        pointer-events: none;
    }

    body::before {
        width: 300px;
        height: 300px;
        background: rgba(56, 189, 248, 0.25);
        top: -80px;
        left: -80px;
    }

    body::after {
        width: 350px;
        height: 350px;
        background: rgba(168, 85, 247, 0.25);
        bottom: -100px;
        right: -80px;
    }

    .box {
        width: 100%;
        max-width: 400px;
        padding: 40px 35px;
        position: relative;
        z-index: 1;

        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);

        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 20px;

        box-shadow:
            0 20px 50px rgba(0, 0, 0, 0.25),
            inset 0 1px 1px rgba(255, 255, 255, 0.2);

        animation: fadeIn 0.7s ease;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(25px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    h2 {
        color: #ffffff;
        font-size: 30px;
        font-weight: 700;
        text-align: center;
        margin-bottom: 10px;
        letter-spacing: 0.5px;
    }

    .box::before {
        content: "Welcome Back";
        display: block;
        color: rgba(255, 255, 255, 0.7);
        font-size: 14px;
        text-align: center;
        margin-bottom: 12px;
        letter-spacing: 1px;
    }

    .error {
        color: #fecaca;
        font-size: 13px;
        text-align: center;
        margin: 12px 0;
        font-weight: 500;
    }

    form {
        margin-top: 25px;
    }

    input {
        width: 100%;
        padding: 14px 16px;
        margin: 10px 0;

        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 10px;
        outline: none;

        background: rgba(255, 255, 255, 0.12);
        color: #ffffff;

        font-size: 15px;
        transition: all 0.3s ease;
    }

    input::placeholder {
        color: rgba(255, 255, 255, 0.65);
    }

    input:focus {
        border-color: #93c5fd;
        background: rgba(255, 255, 255, 0.2);
        box-shadow: 0 0 0 3px rgba(147, 197, 253, 0.2);
    }

    input:valid {
        /* No additional styling required */
    }

    button {
        width: 100%;
        padding: 14px;
        margin-top: 20px;

        border: none;
        border-radius: 10px;

        background: linear-gradient(135deg, #38bdf8, #6366f1);
        color: #ffffff;

        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.5px;

        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 8px 20px rgba(56, 189, 248, 0.25);
    }

    button:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 25px rgba(56, 189, 248, 0.4);
        background: linear-gradient(135deg, #0ea5e9, #4f46e5);
    }

    button:active {
        transform: translateY(0);
    }

    /* Mobile responsiveness */
    @media (max-width: 480px) {
        body {
            padding: 18px;
        }

        .box {
            padding: 32px 24px;
            border-radius: 16px;
        }

        h2 {
            font-size: 26px;
        }

        input {
            padding: 13px;
            font-size: 14px;
        }

        button {
            padding: 13px;
        }
    }

    /* Reduced motion accessibility */
    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            animation: none !important;
            transition: none !important;
        }
    }
</style>
</head>

<body>

    <div class="box">
        <h2>Student Login</h2>

        <p class="error" th:text="${error}"></p>

        <form action="/login" method="post">

            <input
                type="text"
                name="enrollmentNo"
                placeholder="Enrollment No."
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">Login</button>

        </form>
    </div>

</body>
</html>
