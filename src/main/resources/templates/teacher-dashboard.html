<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Dashboard</title>
<style>
  * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
  }

  body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0b1329; /* Deep dark slate background matching the theme */
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
  }

  /* Top Navigation / Header Bar */
  .top {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 18px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
  }

  .top h3 {
      font-size: 18px;
      font-weight: 650;
      color: #f8fafc;
      letter-spacing: 0.3px;
  }

  .top h3 span {
      color: #38bdf8;
  }

  .top a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      padding: 8px 16px;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      transition: all 0.2s ease;
  }

  .top a:hover {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.3);
  }

  /* Main Content Layout */
  .content {
      padding: 30px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
  }

  .content > h3 {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 20px;
  }

  .content > p {
      color: #94a3b8;
      font-size: 15px;
      background: rgba(30, 41, 59, 0.5);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      text-align: center;
  }

  /* Metric Stat Cards Grid */
  .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
  }

  .card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
      transition: transform 0.2s ease;
  }

  .card:hover {
      transform: translateY(-3px);
      border-color: rgba(56, 189, 248, 0.25);
  }

  .card div {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #94a3b8;
      margin-bottom: 8px;
  }

  .card h2 {
      margin: 0;
      font-size: 32px;
      font-weight: 700;
      color: #38bdf8;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
  }

  /* Responsive Table Container */
  table {
      width: 100%;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-collapse: separate;
      border-spacing: 0;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
  }

  th, td {
      padding: 16px 20px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 14.5px;
  }

  th {
      background: rgba(30, 41, 59, 0.8);
      color: #f8fafc;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 1px;
  }

  tr:last-child td {
      border-bottom: none;
  }

  tr:hover td {
      background: rgba(30, 41, 59, 0.4);
  }

  td {
      color: #cbd5e1;
  }

  /* Status Badge Styling classes */
  .NOT {
      color: #94a3b8;
      background: rgba(148, 163, 184, 0.1);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      display: inline-block;
  }

  .SUBMITTED {
      color: #fbbf24;
      background: rgba(251, 191, 36, 0.15);
      border: 1px solid rgba(251, 191, 36, 0.3);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      display: inline-block;
  }

  .EVALUATED {
      color: #4ade80;
      background: rgba(74, 222, 128, 0.15);
      border: 1px solid rgba(74, 222, 128, 0.3);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      display: inline-block;
  }

  /* Action Evaluate Button */
  td a[th\:if] {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      display: inline-block;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      transition: all 0.2s ease;
  }

  td a[th\:if]:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.45);
      background: linear-gradient(135deg, #0284c7, #1d4ed8);
  }

  /* Responsive Adjustments for Mobile Devices */
  @media (max-width: 768px) {
      .content {
          padding: 16px;
      }

      .top {
          padding: 14px 16px;
      }

      table {
          display: block;
          overflow-x: auto;
          white-space: nowrap;
      }
  }

  /* Custom Scrollbar */
  ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
  }
  ::-webkit-scrollbar-thumb {
      background: rgba(56, 189, 248, 0.3);
      border-radius: 10px;
  }
</style>
</head>
<body>
  <div class="top">
    <h3>Teacher Panel - <span th:text="${teacher.name}"></span></h3>
    <a href="/teacher/logout">Logout</a>
  </div>

  <div class="content">
    <h3 th:if="${exam != null}" th:text="${exam.title}"></h3>
    <p th:if="${exam == null}">No exam found.</p>

    <div class="cards">
      <div class="card"><div>Total Students</div><h2 th:text="${totalStudents}"></h2></div>
      <div class="card"><div>Pending Evaluation</div><h2 th:text="${pending}"></h2></div>
      <div class="card"><div>Evaluated</div><h2 th:text="${evaluated}"></h2></div>
    </div>

    <table>
      <tr>
        <th>Enrollment No.</th>
        <th>Name</th>
        <th>Status</th>
        <th>Marks</th>
        <th>Action</th>
      </tr>
      <tr th:each="r : ${rows}">
        <td th:text="${r.enrollmentNo}"></td>
        <td th:text="${r.name}"></td>
        <td th:text="${r.status}"
            th:class="${r.status == 'SUBMITTED'} ? 'SUBMITTED' : (${r.status == 'EVALUATED'} ? 'EVALUATED' : 'NOT')"></td>
        <td th:text="${r.marks}"></td>
        <td>
          <a th:if="${r.canEvaluate}" th:href="@{'/teacher/evaluate/' + ${r.id}}">Evaluate</a>
        </td>
      </tr>
    </table>
  </div>
</body>
</html>
