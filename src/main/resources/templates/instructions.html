<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instructions</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        padding: 40px 24px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Segoe UI', Arial, sans-serif;
        background: #0b1329; /* Deep dark slate background matching image 2 */
        color: #f8fafc;
        position: relative;
        overflow-x: hidden;
    }

    /* Main Container */
    .box {
        width: 100%;
        max-width: 1100px;
        padding: 40px;
        position: relative;
        z-index: 1;
        background: rgba(15, 23, 42, 0.75);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* Top Header / Welcome Section */
    .header-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
        padding-bottom: 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    h2 {
        color: #94a3b8;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 2px;
        font-weight: 600;
    }

    h2 span {
        color: #38bdf8;
        font-size: 18px;
        text-transform: none;
        letter-spacing: normal;
        margin-left: 5px;
    }

    /* Layout Grid for Exam Details and Timer */
    .exam-layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
        align-items: center;
    }

    @media (max-width: 900px) {
        .exam-layout {
            grid-template-columns: 1fr;
        }
    }

    /* Left Side: Timer Widget Card */
    .timer-card {
        background: rgba(30, 41, 59, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 20px;
        padding: 40px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.05);
    }

    /* Circular glowing countdown border decoration */
    .timer-ring {
        width: 220px;
        height: 220px;
        border-radius: 50%;
        border: 4px solid rgba(56, 189, 248, 0.2);
        border-top-color: #38bdf8;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
        box-shadow: 0 0 30px rgba(56, 189, 248, 0.15);
        animation: pulseRing 3s infinite ease-in-out;
    }

    @keyframes pulseRing {
        0%, 100% { box-shadow: 0 0 20px rgba(56, 189, 248, 0.15); }
        50% { box-shadow: 0 0 35px rgba(56, 189, 248, 0.35); }
    }

    #timer {
        font-size: 24px;
        font-weight: 700;
        color: #38bdf8;
        letter-spacing: 0.5px;
        text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    /* Right Side: Exam Info Cards */
    .info-column {
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    /* Exam Title */
    h3 {
        color: #ffffff;
        font-size: 26px;
        font-weight: 700;
        line-height: 1.3;
        margin-bottom: 4px;
    }

    /* Exam Meta Cards (Duration & Starts at) */
    .meta-card {
        background: rgba(30, 41, 59, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 12px;
        padding: 14px 18px;
    }

    .box p {
        color: #94a3b8;
        font-size: 14px;
        line-height: 1.5;
        margin: 4px 0;
    }

    .box p span {
        color: #f1f5f9;
        font-weight: 600;
    }

    /* Instructions heading */
    h4 {
        color: #f8fafc;
        font-size: 15px;
        font-weight: 600;
        margin-top: 5px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    h4::before {
        content: "";
        width: 3px;
        height: 16px;
        border-radius: 4px;
        background: #38bdf8;
    }

    /* Instructions content box */
    .instr {
        white-space: pre-line;
        color: #cbd5e1;
        font-size: 13.5px;
        line-height: 1.7;
        padding: 16px;
        background: rgba(15, 23, 42, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 10px;
        max-height: 160px;
        overflow-y: auto;
    }

    .instr::-webkit-scrollbar {
        width: 5px;
    }

    .instr::-webkit-scrollbar-thumb {
        background: rgba(56, 189, 248, 0.3);
        border-radius: 10px;
    }

    /* Start exam button container & styling */
    form {
        margin-top: 10px;
    }

    button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #0284c7, #2563eb);
        color: #ffffff;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.5px;
        cursor: pointer;
        transition: all 0.25s ease;
        box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
    }

    button:not(:disabled):hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(37, 99, 235, 0.45);
        background: linear-gradient(135deg, #0284c7, #1d4ed8);
    }

    button:not(:disabled):active {
        transform: translateY(0);
    }

    button:disabled {
        background: rgba(51, 65, 85, 0.4);
        color: rgba(148, 163, 184, 0.5);
        cursor: not-allowed;
        box-shadow: none;
        border: 1px solid rgba(255, 255, 255, 0.04);
    }

    /* No exam message box */
    .box > div[th\:if="${exam == null}"] p {
        padding: 30px;
        text-align: center;
        border-radius: 12px;
        background: rgba(30, 41, 59, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.06);
        color: #94a3b8;
        font-size: 16px;
    }

    /* Responsive adjustments */
    @media (max-width: 600px) {
        body {
            padding: 16px 12px;
        }

        .box {
            padding: 24px 18px;
            border-radius: 18px;
        }

        .timer-ring {
            width: 170px;
            height: 170px;
        }

        #timer {
            font-size: 18px;
        }

        h3 {
            font-size: 22px;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            animation: none !important;
            transition: none !important;
        }
    }
</style>
</head>

<body>
  <div class="box">
    <div class="header-top">
      <h2>Candidate: <span th:text="${student.name}"></span></h2>
    </div>

    <div th:if="${exam == null}">
      <p>No exam is scheduled right now.</p>
    </div>

    <div th:if="${exam != null}" class="exam-layout">
      <!-- Left Column: Timer Graphic Card -->
      <div class="timer-card">
        <div class="timer-ring">
          <div id="timer"></div>
        </div>
      </div>

      <!-- Right Column: Details & Instructions -->
      <div class="info-column">
        <div>
          <h3 th:text="${exam.title}"></h3>
        </div>

        <div class="meta-card">
          <p>Duration: <span th:text="${exam.durationMin}"></span> minutes</p>
          <p>Starts at: <span th:text="${#temporals.format(exam.startTime, 'dd MMM yyyy, hh:mm a')}"></span></p>
        </div>

        <div>
          <h4>Exam Instructions</h4>
          <div class="instr" th:text="${exam.instructions}"></div>
        </div>

        <form action="/exam" method="get">
          <button type="submit" id="startBtn" disabled>Start Exam</button>
        </form>
      </div>
    </div>
  </div>

<script th:inline="javascript">
  // time left from server
  var remaining = /*[[${remainingMs}]]*/ 0;
  var timer = document.getElementById('timer');
  var btn = document.getElementById('startBtn');

  function tick() {
    if (remaining <= 0) {
      timer.textContent = 'Exam has started';
      btn.disabled = false;
      clearInterval(t);
      return;
    }
    var s = Math.floor(remaining / 1000);
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    var sec = s % 60;
    timer.textContent = h + 'h ' + m + 'm ' + sec + 's';
    remaining -= 1000;
  }

  var t = setInterval(tick, 1000);
  tick();
</script>
</body>
</html>
